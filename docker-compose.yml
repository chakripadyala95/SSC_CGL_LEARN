# Local stack: PostgreSQL, the FastAPI backend and the Next.js app.
# `make up`, then `make load` to fill the database from data/.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ssc
      POSTGRES_PASSWORD: ssc
      POSTGRES_DB: ssc
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ssc -d ssc"]
      interval: 2s
      retries: 30

  api:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    environment:
      DATABASE_URL: postgresql+psycopg://ssc:ssc@db:5432/ssc
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data:ro
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }

  web:
    build: { context: ., dockerfile: docker/web.Dockerfile }
    environment:
      API_URL: http://api:8000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
